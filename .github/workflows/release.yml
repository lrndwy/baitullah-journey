name: Release images

# The output of this pipeline is Docker images, published to GitHub Container
# Registry. `main` produces `:edge` plus an immutable `:sha-<short>`; a `v*` tag
# additionally produces the version tag and `:latest`.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # `ghcr.io/<owner>/<repo>` — lowercased, because GHCR rejects uppercase paths.
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # CI runs first; a red build never produces an image.
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40

    permissions:
      contents: read
      packages: write
      # Required for provenance attestations, which are signed with the OIDC
      # token rather than a stored key.
      id-token: write
      attestations: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: docker/api.Dockerfile
          - image: web
            dockerfile: docker/web.Dockerfile

    steps:
      - uses: actions/checkout@v7

      # QEMU lets one runner emit both architectures, so an arm64 laptop and an
      # amd64 server pull the same tag.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          tags: |
            type=ref,event=branch,suffix=-{{sha}}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # Only a fallback: the web image reads `API_PUBLIC_URL` at container
          # start, so the same tag runs in staging and production unchanged.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:3000' }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          # `provenance` records how and from what the image was built; `sbom`
          # records what is inside it. Both are attached to the manifest, so a
          # consumer can verify the image they pulled rather than trusting it.
          provenance: mode=max
          sbom: true

      # Scans the image that was just pushed, by digest — so this covers the
      # amd64/arm64 manifest and the layers consumers will actually pull.
      - name: Scan the published image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      # The gate: a published image with a high or critical finding fails the
      # release. The SARIF is written rather than uploaded, because uploading
      # needs GitHub Advanced Security on a private repository — and this is the
      # same script the security workflow runs, so both paths agree on what
      # "blocking" means.
      - name: Fail on high or critical findings
        run: node scripts/check-sarif.mjs trivy-${{ matrix.image }}.sarif

      # Attached even on failure, so the report survives the red build.
      - name: Attach the vulnerability report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-${{ matrix.image }}-sarif
          path: trivy-${{ matrix.image }}.sarif
          retention-days: 14

      - name: Summary
        if: success()
        run: |
          {
            echo "### Published \`${{ matrix.image }}\`"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
