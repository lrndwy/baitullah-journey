name: baitullah-journey-prod

# Production-shaped stack: no source mounts, no dev sign-in, secrets required.
#   cp .env.example .env   (then set real secrets)
#   docker compose -f docker/docker-compose.prod.yml up --build -d
#
# Put a TLS terminator (Caddy, Traefik, an ALB) in front of `web` and `api`;
# this file deliberately does not terminate TLS itself.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-app}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10

  # S3-compatible object storage. Point the API at RustFS, MaxIO or an external
  # S3 endpoint instead by setting S3_ENDPOINT and removing this service.
  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
      RUSTFS_VOLUMES: /data
      RUSTFS_OBS_LOGGER_LEVEL: warn
    volumes:
      - rustfsdata:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'curl -s -o /dev/null http://localhost:9000/']
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-app}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      WEB_ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN}
      MODULES_ENABLED: ${MODULES_ENABLED:-}
      MODULES_DISABLED: ${MODULES_DISABLED:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://rustfs:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-app}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?set S3_PUBLIC_ENDPOINT to the browser-reachable object storage URL}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@example.com}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUTH_DEV_LOGIN: 'false'
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    restart: unless-stopped
    # Scale with: docker compose -f docker/docker-compose.prod.yml up --scale api=3
    # The API is stateless; sessions live in Postgres and the limiter in Redis.

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
      args:
        # Fallback only. `API_PUBLIC_URL` below is what the browser actually
        # uses, and it is read at container start — so the same image runs in
        # staging and production without a rebuild.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    environment:
      NODE_ENV: production
      PORT: '3001'
      # Server-side fetches (branding) must reach the API over the compose
      # network; the browser-facing URL is injected into the page instead.
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3000}
      API_PUBLIC_URL: ${API_PUBLIC_URL:?set API_PUBLIC_URL to the browser-reachable API URL}
    ports:
      - '3001:3001'
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  rustfsdata:
